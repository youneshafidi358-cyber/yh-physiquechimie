<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="Kalam, 'Comic Neue', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8ec5ff"/><stop offset=".45" stop-color="#3f7fd6"/><stop offset=".8" stop-color="#1a2f6e"/><stop offset="1" stop-color="#0b1233"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="520" height="300" fill="url(#sky)" rx="14"/>
  <path d="M0 300 Q260 270 520 300 L520 330 L0 330 Z" fill="#3a8f4a"/>
